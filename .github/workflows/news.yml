name: Collect fossil news

on:
  schedule:
    - cron: '17 */3 * * *'   # every three hours, at :17
  workflow_dispatch: {}       # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ['tools/news.py', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: python3 tools/news.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "dinotracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news-articles.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "News update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
